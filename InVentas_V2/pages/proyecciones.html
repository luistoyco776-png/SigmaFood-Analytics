<section class="proyecciones-page">

    <header class="page-header">

        <h1>Proyecciones</h1>

        <p>Demanda futura basada en tendencias</p>

    </header>

    <section class="projection-controls">

        <label>Periodo de proyección (días)</label>

        <input type="range" id="projectionRange" min="7" max="60" value="30">

        <span id="projectionDays">30 días</span>

    </section>

    <section class="projection-result">

        <div class="big-number">

            <h2 id="projectedDemand">--</h2>

            <p>unidades proyectadas</p>

        </div>

    </section>

    <section class="inventory-impact">

        <h3>Impacto en inventario</h3>

        <div id="inventoryProjection">

            <!-- dinámico -->

        </div>

    </section>

    <section class="math-box">

        <h3>Modelo Matemático</h3>

        <div id="integralFormula" class="formula">

            ∫ D(t) dt

        </div>

        <p class="formula-desc">

            Demanda acumulada proyectada en el tiempo

        </p>

    </section>

    <div class="decision-box">
        <h3>Decisión del sistema</h3>
        <pre id="decisionText"></pre>
    </div>

</section>
